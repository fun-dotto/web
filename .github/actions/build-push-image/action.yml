name: Build and Push Image
description: 環境ごとのビルド引数で Docker イメージをビルドし、コミット SHA と latest のタグで Artifact Registry に push する
inputs:
  image_name:
    description: タグなしの Docker イメージ参照（環境ごとに分ける）
    required: true
  environment:
    description: ビルド対象の環境（dev, stg, prd）
    required: true
  ar_hostname:
    description: Artifact Registry のホスト名
    required: true
  project_id:
    description: GCP プロジェクト ID
    required: true
  workload_identity_provider:
    description: Workload Identity プロバイダ
    required: true
  service_account:
    description: 借用するサービスアカウント
    required: true
  firebase_api_key:
    required: true
  firebase_auth_domain:
    required: true
  firebase_project_id:
    required: true
  firebase_storage_bucket:
    required: true
  firebase_messaging_sender_id:
    required: true
  firebase_app_id:
    required: true
  firebase_measurement_id:
    required: false
  firebase_appcheck_site_key:
    required: false
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      env:
        DOTTO_ENV: ${{ inputs.environment }}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase_auth_domain }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ inputs.firebase_storage_bucket }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.firebase_messaging_sender_id }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ inputs.firebase_measurement_id }}
        NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ inputs.firebase_appcheck_site_key }}
      # 値を省略した --build-arg は同名の環境変数から渡される。
      run: |
        docker build \
        -t ${{ inputs.image_name }}:${{ github.sha }} \
        . \
        -f Dockerfile \
        --no-cache \
        --build-arg DOTTO_ENV \
        --build-arg NEXT_PUBLIC_FIREBASE_API_KEY \
        --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
        --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID \
        --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
        --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
        --build-arg NEXT_PUBLIC_FIREBASE_APP_ID \
        --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID \
        --build-arg NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ inputs.project_id }}
    - name: Configure Docker
      shell: bash
      run: |
        gcloud auth \
        configure-docker \
        ${{ inputs.ar_hostname }}
    - name: Push
      shell: bash
      run: |
        docker push \
        ${{ inputs.image_name }}:${{ github.sha }}
    # SHA タグの push が成功した場合のみ latest を更新する。
    # イメージは環境ごとに分かれているため、latest はその環境の最新ビルドを指す。
    - name: Push latest
      shell: bash
      run: |
        docker tag \
        ${{ inputs.image_name }}:${{ github.sha }} \
        ${{ inputs.image_name }}:latest
        docker push \
        ${{ inputs.image_name }}:latest
