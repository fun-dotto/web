name: Deploy to Cloud Run
description: Docker イメージを Cloud Run サービスとしてデプロイする
inputs:
  service:
    description: Cloud Run のサービス名
    required: true
  image:
    description: タグ付きの Docker イメージ参照
    required: true
  region:
    description: デプロイ先のリージョン
    required: true
  workload_identity_provider:
    description: Workload Identity プロバイダ
    required: true
  service_account:
    description: 借用するサービスアカウント
    required: true
runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: ${{ inputs.service }}
        image: ${{ inputs.image }}
        region: ${{ inputs.region }}
