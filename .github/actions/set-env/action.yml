name: Set Environment
description: トリガーに応じて環境、サービス名、イメージのタグを設定する
inputs:
  ar_hostname:
    description: Artifact Registry のホスト名
    required: true
  project_id:
    description: GCP プロジェクト ID
    required: true
  image_tag:
    description: デプロイするイメージのタグ
    required: false
    default: ${{ github.sha }}
outputs:
  environment:
    description: デプロイ先の環境（stg, prd など）
    value: ${{ steps.set-env.outputs.environment }}
  service_name:
    description: Cloud Run のサービス名（prd はサフィックスなし）
    value: ${{ steps.set-env.outputs.service_name }}
  image_tag:
    description: Docker イメージのタグ付き参照（環境ごとに分けない）
    value: ${{ steps.set-env.outputs.image_tag }}
runs:
  using: composite
  steps:
    - id: set-env
      shell: bash
      run: |
        # Environment
        IS_WORKFLOW_DISPATCH="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name != '' }}"
        IS_PUSH_TO_MAIN="${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}"
        if [ $IS_WORKFLOW_DISPATCH = "true" ]; then
          export TARGET_ENVIRONMENT="${{ github.event.inputs.environment_name }}"
        elif [ $IS_PUSH_TO_MAIN = "true" ]; then
          export TARGET_ENVIRONMENT="stg"
        else
          exit 1
        fi

        echo "Environment: $TARGET_ENVIRONMENT"

        # Service name suffix
        if [ "$TARGET_ENVIRONMENT" = "prd" ]; then
          export SERVICE_NAME_SUFFIX=""
        else
          export SERVICE_NAME_SUFFIX="-$TARGET_ENVIRONMENT"
        fi

        export REPO_NAME=$(echo ${{ github.repository }} | awk -F '/' '{print $2}')
        export SERVICE_NAME=$REPO_NAME$SERVICE_NAME_SUFFIX
        # イメージは環境ごとに分けず、全環境で同じイメージをタグで指定する。
        export IMAGE_TAG=${{ inputs.ar_hostname }}/${{ inputs.project_id }}/github-actions/$REPO_NAME:${{ inputs.image_tag }}

        echo "Repository name: $REPO_NAME"
        echo "Service name: $SERVICE_NAME"
        echo "Image tag: $IMAGE_TAG"

        echo "environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"
        echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
        echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
