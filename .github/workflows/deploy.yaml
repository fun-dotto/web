name: Deploy

# main への push: stg 向けにビルドして latest を更新し、stg へデプロイする。
# イメージは NEXT_PUBLIC_* を埋め込むため環境ごとに分かれる。
# 手動実行: action で実行範囲を選択する。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 実行内容
        required: true
        type: choice
        default: build-push-deploy
        options:
          - build-push-deploy
          - build-push
          - deploy
      environment_name:
        description: 対象の環境（prd は build-push / deploy でのみ指定可）
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
      image_tag:
        description: デプロイするイメージのタグ（deploy でのみ使用、未指定の場合は latest）
        required: false
        type: string
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      service_name: ${{ steps.set-env.outputs.service_name }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      image_name: ${{ steps.image-name.outputs.image_name }}
    steps:
      # prd へは、ビルド済みのイメージタグを指定する deploy でのみデプロイする。
      - if: inputs.action == 'build-push-deploy' && inputs.environment_name == 'prd'
        name: Reject prd
        run: |
          echo "prd は action: build-push または deploy でのみ指定できます" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-env
        uses: ./.github/actions/set-env
        with:
          ar_hostname: ${{ vars._AR_HOSTNAME }}
          project_id: ${{ vars.PROJECT_ID }}
          image_tag: ${{ inputs.action == 'deploy' && (inputs.image_tag || 'latest') || github.sha }}
      - id: image-name
        run: |
          IMAGE_TAG="${{ steps.set-env.outputs.image_tag }}"
          echo "image_name=${IMAGE_TAG%:*}" >> "$GITHUB_OUTPUT"

  build-and-push:
    if: inputs.action != 'deploy'
    runs-on: ubuntu-latest
    # 環境ごとの Secrets をビルド引数に使う。
    environment: ${{ needs.set-env.outputs.environment }}
    needs:
      - set-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-push-image
        with:
          image_name: ${{ needs.set-env.outputs.image_name }}
          environment: ${{ needs.set-env.outputs.environment }}
          ar_hostname: ${{ vars._AR_HOSTNAME }}
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          firebase_api_key: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          firebase_auth_domain: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          firebase_project_id: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          firebase_storage_bucket: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          firebase_messaging_sender_id: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          firebase_app_id: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          firebase_measurement_id: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          firebase_appcheck_site_key: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}

  deploy:
    # build-and-push がスキップされた場合もデプロイするため、結果を明示的に判定する。
    if: >-
      !cancelled()
      && inputs.action != 'build-push'
      && needs.set-env.result == 'success'
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    needs:
      - set-env
      - build-and-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/deploy-cloud-run
        with:
          service: ${{ needs.set-env.outputs.service_name }}
          image: ${{ needs.set-env.outputs.image_tag }}
          region: ${{ vars._DEPLOY_REGION }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
